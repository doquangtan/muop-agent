# Cấu hình nginx tối giản cho website tĩnh Mướp Agents.
# Mount thay cho /etc/nginx/nginx.conf của image nginxinc/nginx-unprivileged
# (chạy không root, cổng 8080, pid và file tạm nằm trong /tmp).

worker_processes 1;            # website tĩnh: 1 worker là đủ, tiết kiệm RAM
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Thư mục tạm ghi vào tmpfs (hệ thống file chỉ đọc)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Nhẹ: không ghi access log, ẩn phiên bản nginx
    access_log off;
    server_tokens off;

    # Đếm lượt tải: chỉ ghi request tải file từ HOST CÔNG KHAI.
    # Truy cập localhost/LAN (kiểm tra nội bộ) có host khác nên không được ghi.
    # Không ghi IP, user-agent hay referer để giữ riêng tư.
    map $host $dl_public {
        agents.muop.vn  1;     # <- đổi thành domain công khai của bạn nếu khác
        default         0;
    }
    log_format dl_log '$time_iso8601 $host $request_method $uri $status $body_bytes_sent';

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;

    # Nén văn bản; ảnh và file tải về đã nén sẵn nên không nén lại
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Bảo mật cơ bản
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            try_files $uri $uri/ =404;
        }

        # Ảnh, CSS, JS đổi ít: cho trình duyệt cache
        location /assets/img/ {
            expires 7d;
            add_header Cache-Control "public";
        }
        location ~ ^/assets/(css|js)/ {
            expires 1d;
            add_header Cache-Control "public";
        }

        # File cài đặt: KHÔNG cache (trình duyệt và Cloudflare) để mọi lần tải đều tới máy chủ và được đếm
        location /assets/downloads/ {
            access_log /var/log/nginx-dl/access.log dl_log if=$dl_public;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Số liệu lượt tải do sidecar tổng hợp (chỉ đọc)
        location ^~ /stats/ {
            alias /usr/share/nginx/stats/;
            default_type application/json;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # Không phục vụ file ẩn, thư mục cấu hình Docker
        location ~ /\. {
            deny all;
        }
        location ^~ /deploy/ {
            deny all;
        }
        location = /docker-compose.yml {
            deny all;
        }
    }
}
