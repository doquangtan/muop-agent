[package]
name = "muop-agent-app"
version = "1.1.0"
edition = "2021"
description = "Mướp Agent — client Dioxus (Linux trước, đa nền tảng). Chỉ nói chuyện với muop-agent-server qua REST và Socket.IO."
publish = false

[dependencies]
dioxus = { version = "0.7.2" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Timer theo nền tảng: tokio trên desktop/mobile, gloo-timers trên web (wasm).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "wasmbind"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]

[profile.release]
opt-level = 3
