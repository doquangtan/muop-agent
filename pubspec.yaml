name: muop_agent
description: "Mướp Agent Monitor — Ứng dụng Giao diện (Desktop & Mobile) kết nối Rust Server qua Socket.IO Realtime"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  socket_io_client: ^3.0.2
  xterm: ^4.0.0
  material_ui: ^1.11.1
  url_launcher: ^6.3.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  file_picker: ^13.4.0
  flutter_riverpod: ^3.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
