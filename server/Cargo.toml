[package]
name = "muop-agent-server"
version = "1.0.0"
edition = "2021"
description = "Mướp Agent Monitor Rust Backend Server (REST + Socket.IO Realtime)"

[dependencies]
libc = "0.2"
base64 = "0.22"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
socketioxide = { version = "0.14", features = ["state"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = "0.31"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ksni = "0.3.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zbus = "5"
futures-util = "0.3"
tokio-tungstenite = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
notify = "9"

# FUSE (mount project của máy khác): Linux dùng libfuse sẵn có. macOS cần thư viện `fuse` (FUSE-T hoặc macFUSE)
# nên chỉ bật khi build với `--features mac-fuse` (xem Makefile: MAC_FEATURES), để bản build thường vẫn chạy được.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.19"

[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "0.19", optional = true }

[features]
mac-fuse = ["dep:fuser"]
# Build tĩnh cho gói .deb server (NAS, máy không có libsqlite3 đúng phiên bản): đóng gói SQLite vào binary.
bundled-sqlite = ["rusqlite/bundled"]
